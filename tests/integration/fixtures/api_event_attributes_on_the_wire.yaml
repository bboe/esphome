esphome:
  name: api-event-attributes-test

host:

api:
  batch_delay: 0ms

logger:

event:
  # The names and the types are declared once, here; each event carries values
  # against this list and may carry any subset of it.
  - platform: template
    name: Action Button
    id: action_button
    event_types:
      - press
      - multi_press_end
      - long_press_end
    attributes:
      multi_press_count: int
      duration: float
      pressed: bool
      label: string

interval:
  # Every event type on every tick, so a client that subscribes at any moment
  # sees one of each within two ticks.
  - interval: 100ms
    then:
      - event.trigger:
          id: action_button
          event_type: multi_press_end
          attributes:
            multi_press_count: 3
      - event.trigger:
          id: action_button
          event_type: long_press_end
          attributes:
            duration: !lambda "return 1.5f;"
            pressed: true
            label: !lambda 'return std::string("held");'
      - event.trigger:
          id: action_button
          event_type: press
      # Nothing is retained past the trigger that set it, which is what stops a
      # response that could not be encoded now from picking up a later
      # trigger's values when the socket drains.
      - lambda: |-
          ESP_LOGI("test", "retained attributes: %u",
                   (unsigned) id(action_button).get_attribute_states().size());
