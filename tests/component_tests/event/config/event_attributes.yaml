esphome:
  name: test-event-attributes

host:

api:

logger:

event:
  - platform: template
    name: Attributed Button
    id: attributed_button
    event_types:
      - press
      - multi_press_end
      - long_press_end
    attributes:
      multi_press_count: int
      duration: float
      pressed: bool
      label: string

  # Fewer attributes than the entity above, so the emitted bound is a maximum
  # rather than the last one seen.
  - platform: template
    name: Attributed Doorbell
    id: attributed_doorbell
    event_types:
      - ring
    attributes:
      chime: string

  - platform: template
    name: Attributeless Event
    id: attributeless_event
    event_types:
      - ping

interval:
  - interval: 1s
    then:
      - event.trigger:
          id: attributed_button
          event_type: multi_press_end
          attributes:
            multi_press_count: 3
      - event.trigger:
          id: attributed_button
          event_type: long_press_end
          attributes:
            duration: !lambda "return 1.5f;"
            pressed: true
            label: held
      # No values: neither setter is emitted for this one.
      - event.trigger:
          id: attributed_button
          event_type: press
